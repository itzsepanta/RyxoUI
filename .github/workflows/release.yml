name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build the frontend
        working-directory: web
        run: npm run build

      - name: Build the panel binaries
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            suffix=""
            if [ "$os" = "windows" ]; then
              suffix=".exe"
            fi
            name="ryxoui_${VERSION#v}_${os}_${arch}"
            out="dist/${name}.tar.gz"

            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION#v}" \
              -o "dist/ryxoui${suffix}" ./cmd/ryxoui

            cp LICENSE README.md dist/
            tar -czf "$out" -C dist "ryxoui${suffix}" LICENSE README.md
            rm -f "dist/ryxoui${suffix}"
            (cd dist && sha256sum "$(basename "$out")" > "$(basename "$out").sha256")
            echo "built $out"
          done

      - name: Upload the artefacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${VERSION}"
          if [ ! "${tag}" = "${GITHUB_REF#refs/tags/}" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if ! git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            git tag -a "$tag" -m "Release $tag"
            git push origin "refs/tags/$tag"
          fi
          gh release create "$tag" dist/*.tar.gz dist/*.tar.gz.sha256 \
            --title "RyxoUI $tag" \
            --generate-notes || \
          gh release upload "$tag" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
